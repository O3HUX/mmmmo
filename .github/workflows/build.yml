name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o atmosphere.zip
          ls -la
          ls -la atmosphere

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant execute permission
        run: chmod +x atmosphere/gradlew

      - name: Build
        working-directory: atmosphere
        run: ./gradlew build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: atmosphere-jar
          path: atmosphere/build/libs/*.jar
